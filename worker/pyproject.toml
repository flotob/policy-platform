[project]
name = "policy-worker"
version = "0.1.0"
description = "policy platform extraction worker: PDF/DOCX to text over the Postgres job queue"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2",
    "jsonschema>=4.21",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
policy-worker = "policy_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
