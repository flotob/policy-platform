name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: policy
          POSTGRES_PASSWORD: policy
          POSTGRES_DB: policy
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U policy"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://policy:policy@localhost:5433/policy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm test
      - name: contract artifacts are up to date
        run: git diff --exit-code packages/contracts/schemas

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "worker[dev]"
      - run: pytest worker/tests -q
